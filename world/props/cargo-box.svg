<?xml version="1.0" encoding="UTF-8"?>
<!-- Caja de carga (vista cenital, ~40 px en juego). Metal oscuro con emisivo cian:
     el brillo la hace legible sobre el fondo estelar a tamano pequeno. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#00E5FF" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tapa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A4358"/>
      <stop offset=".5" stop-color="#232A3B"/>
      <stop offset="1" stop-color="#141926"/>
    </linearGradient>
    <linearGradient id="banda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FF4FF"/>
      <stop offset=".5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0793A6"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#halo)"/>
  <!-- cuerpo -->
  <rect x="16" y="14" width="32" height="36" rx="3" fill="url(#tapa)" stroke="#0B0E18" stroke-width="1.5"/>
  <!-- filo especular superior-izquierdo -->
  <path d="M18 16 h27 a2 2 0 0 1 2 2 v2 h-31 v-2 a2 2 0 0 1 2-2 Z" fill="#4C5871" opacity=".55"/>
  <!-- costillas -->
  <rect x="16" y="24" width="32" height="2.4" fill="#10141F"/>
  <rect x="16" y="38" width="32" height="2.4" fill="#10141F"/>
  <!-- banda emisiva central -->
  <rect x="29.4" y="14" width="5.2" height="36" fill="url(#banda)"/>
  <rect x="30.7" y="14" width="2.6" height="36" fill="#DFFBFF" opacity=".8"/>
  <!-- remaches -->
  <g fill="#6B7690">
    <circle cx="20" cy="18.5" r="1.1"/><circle cx="44" cy="18.5" r="1.1"/>
    <circle cx="20" cy="45.5" r="1.1"/><circle cx="44" cy="45.5" r="1.1"/>
  </g>
  <!-- luz de estado -->
  <circle cx="43" cy="31.8" r="1.8" fill="#00E5FF"/>
  <circle cx="43" cy="31.8" r="3.4" fill="#00E5FF" opacity=".25"/>
</svg>
