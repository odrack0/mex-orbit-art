<?xml version="1.0" encoding="UTF-8"?>
<!-- Portal entre mapas (vista cenital, ~140 px en juego). Anillo de metal oscuro
     con vortice violeta->cian; el remolino interior insinua rotacion sin animar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="phalo" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="78%" stop-color="#A78BFA" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vortice" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset=".25" stop-color="#7FD9FF"/>
      <stop offset=".55" stop-color="#7B5FD6"/>
      <stop offset=".85" stop-color="#2A1E55"/>
      <stop offset="1" stop-color="#150F2E"/>
    </radialGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454F66"/>
      <stop offset=".5" stop-color="#1D2333"/>
      <stop offset="1" stop-color="#0E1220"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="79" fill="url(#phalo)"/>
  <!-- aro exterior -->
  <circle cx="80" cy="80" r="56" fill="none" stroke="url(#aro)" stroke-width="12"/>
  <circle cx="80" cy="80" r="62.5" fill="none" stroke="#0B0E18" stroke-width="1.6"/>
  <circle cx="80" cy="80" r="49.5" fill="none" stroke="#0B0E18" stroke-width="1.6"/>
  <!-- nodos del aro -->
  <g fill="#232A3B" stroke="#0B0E18" stroke-width="1.2">
    <circle cx="80" cy="21" r="6"/><circle cx="80" cy="139" r="6"/>
    <circle cx="21" cy="80" r="6"/><circle cx="139" cy="80" r="6"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="80" cy="21" r="2"/><circle cx="80" cy="139" r="2"/>
    <circle cx="21" cy="80" r="2"/><circle cx="139" cy="80" r="2"/>
  </g>
  <!-- vortice -->
  <circle cx="80" cy="80" r="48" fill="url(#vortice)"/>
  <!-- brazos del remolino -->
  <g fill="none" stroke="#CFEAFF" stroke-linecap="round" opacity=".55">
    <path d="M80 80 q22 -6 26 -28" stroke-width="3"/>
    <path d="M80 80 q-20 12 -12 32" stroke-width="3"/>
    <path d="M80 80 q-14 -20 8 -34" stroke-width="2.2"/>
    <path d="M80 80 q18 16 -4 30" stroke-width="2.2"/>
  </g>
  <g fill="none" stroke="#A78BFA" stroke-linecap="round" opacity=".5">
    <path d="M80 80 q30 4 34 -18" stroke-width="2"/>
    <path d="M80 80 q-30 -2 -34 18" stroke-width="2"/>
  </g>
  <!-- nucleo -->
  <circle cx="80" cy="80" r="7" fill="#EAF6FF"/>
  <circle cx="80" cy="80" r="12" fill="#7FD9FF" opacity=".4"/>
</svg>
